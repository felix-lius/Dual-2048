<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Simultwin</title>

  <!--
    说明：本游戏是纯静态站点，无任何外部运行时依赖。
    - Phaser 3 引擎已本地化（vendor/phaser.min.js），不依赖 CDN；
    - 可选的集成层（src/integration.js）仅在宿主页面注入了
      window.__GAME_INTEGRATION__ 时才生效，缺失时全部静默 no-op，游戏照常完整可玩。
    因此把本文件（含相对路径引用的资源）直接作为站点根目录即可运行，无需构建。
  -->

  <style>
    html, body, #game {
      font-family: "Nunito", "Quicksand", "Varela Round", "PingFang SC", "Microsoft YaHei", "SimHei", "Segoe UI", system-ui, sans-serif;
    }
    /* 移动端体验优化：禁用文本选中 / 长按放大镜 / 长按呼出菜单 / 点击高亮，
       否则双击与长按会触发系统 UI，干扰滑动操作。 */
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #FFF9EF;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #game {
      width: 100vw;
      height: 100vh;
    }
    canvas { display: block; }
  </style>

  <!-- Phaser 3（本地化，去外网依赖） -->
  <script src="./vendor/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
